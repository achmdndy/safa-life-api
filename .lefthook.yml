pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    
    lint:
      glob: "*.go"
      run: golangci-lint run {staged_files}
    
    test:
      run: go test ./...
    
    mod-tidy:
      run: go mod tidy
      stage_fixed: true

pre-push:
  commands:
    test:
      run: go test -race -coverprofile=coverage.out ./...
    
    build:
      run: go build -o /tmp/safa-life-api ./cmd/server

commit-msg:
  commands:
    conventional-commit:
      run: |
        if ! grep -qE "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .+" "$1"; then
          echo "Commit message must follow conventional commit format:"
          echo "type(scope): description"
          echo ""
          echo "Types: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert"
          exit 1
        fi