global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape metrics directly from Safa Life API
  - job_name: 'safa-life-api'
    static_configs:
      - targets: ['api:8080']  # Docker service name for internal network
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 5s