      responses:
        "200":
          description: Juz deleted successfully
          schema:
            $ref: '#/definitions/quran.JuzSuccessResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "404":
          description: Juz not found
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
      summary: Delete a juz
      tags:
      - Juz
    get:
      consumes:
      - application/json
      description: Get a specific juz by its ID
      parameters:
      - description: Juz ID
        in: path
        name: id
        required: true
        type: string
      - description: Include related data
