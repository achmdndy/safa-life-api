            $ref: '#/definitions/quran.QuranErrorResponse'
        "404":
          description: Juz not found
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
      summary: Get juz by ID
      tags:
