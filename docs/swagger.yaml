        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
      summary: Get all juz
      tags:
      - Juz
    post:
      consumes:
      - application/json
      description: Create a new juz with the provided information
      parameters:
      - description: Juz information
        in: body
        name: juz
        required: true
        schema:
          $ref: '#/definitions/dto.CreateJuzRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Juz created successfully
          schema:
            $ref: '#/definitions/quran.JuzSuccessResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
      summary: Create a new juz
      tags:
      - Juz
  /v1/quran/juz/{id}:
