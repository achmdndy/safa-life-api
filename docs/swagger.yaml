externalDocs:
  description: Safalife API Documentation
  url: https://docs.safalife.com/api
host: localhost:8080
info:
  contact:
    email: api-support@safalife.com
    name: Safalife API Support Team
    url: http://www.safalife.com/support
  description: Safalife API is a comprehensive backend service for Safalife's competition
    management system. This API provides endpoints for health monitoring, user management,
    competition tracking, and administrative functions. Built with Go using Clean
    Architecture principles, it offers high performance and reliability for managing
    large-scale competitions.
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Safalife API
  version: 1.0.0
paths:
  /v1/quran/ayahs:
    post:
      consumes:
      - application/json
      description: Create a new ayah in the Quran
      parameters:
      - description: Create ayah request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAyahRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Ayah created successfully
          schema:
            $ref: '#/definitions/quran.CreateAyahSuccessResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
      summary: Create a new ayah
      tags:
      - Ayahs
  /v1/quran/ayahs/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an existing ayah from the Quran
      parameters:
      - description: Ayah ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ayah deleted successfully
          schema:
            $ref: '#/definitions/quran.DeleteAyahSuccessResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "404":
          description: Ayah not found
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
      summary: Delete an ayah
      tags:
      - Ayahs
    get:
      consumes:
      - application/json
      description: Get an ayah by its ID from the Quran
      parameters:
      - description: Ayah ID
        in: path
        name: id
        required: true
        type: string
      - description: Include related data
        enum:
        - surah
        example: surah
        in: query
        name: include
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ayah retrieved successfully
          schema:
            $ref: '#/definitions/quran.GetAyahByIdSuccessResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "404":
          description: Ayah not found
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
      summary: Get ayah by ID
      tags:
      - Ayahs
    put:
      consumes:
      - application/json
      description: Update an existing ayah in the Quran
      parameters:
      - description: Ayah ID
        in: path
        name: id
        required: true
        type: string
      - description: Update ayah request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAyahRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Ayah updated successfully
          schema:
            $ref: '#/definitions/quran.UpdateAyahSuccessResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "404":
          description: Ayah not found
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
      summary: Update an ayah
      tags:
      - Ayahs
  /v1/quran/ayahs/surah/{surahId}:
    get:
      consumes:
      - application/json
      description: Get all ayahs from a specific surah with pagination
      parameters:
      - description: Surah ID
        in: path
        name: surahId
        required: true
        type: string
      - default: 0
        description: Limit (0 for all)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      - description: Include related data
        enum:
        - surah
        example: surah
        in: query
        name: include
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ayahs retrieved successfully
          schema:
            $ref: '#/definitions/quran.GetAyahsBySurahSuccessResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
      summary: Get ayahs by surah
      tags:
      - Ayahs
  /v1/quran/juz:
    get:
      consumes:
      - application/json
      description: Get all juz with pagination
      parameters:
      - default: 0
        description: Limit (0 for all)
        in: query
        name: limit
        type: integer
      - default: 0
