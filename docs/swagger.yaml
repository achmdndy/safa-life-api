host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Al-Quran API with comprehensive Islamic content
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Safa Life API
  version: "1.0"
paths:
  /audio/ayahs:
    post:
      consumes:
      - application/json
      description: Add a new audio file for a specific ayah.
      parameters:
      - description: Ayah Audio Data
        in: body
        name: ayah_audio
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAyahAudioRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Ayah audio created successfully
          schema:
            allOf:
            - $ref: '#/definitions/core.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AyahAudioResponse'
              type: object
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Create Ayah Audio
      tags:
      - Audio
  /audio/ayahs/{reciter_id}/{surah_id}/{ayah_id}:
    delete:
      consumes:
      - application/json
      description: Delete a specific ayah audio file.
      parameters:
      - description: Reciter ID
        in: path
        name: reciter_id
        required: true
        type: string
      - description: Surah ID
        in: path
        name: surah_id
        required: true
        type: integer
      - description: Ayah ID
        in: path
        name: ayah_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Ayah audio deleted successfully
          schema:
            $ref: '#/definitions/core.SuccessResponse'
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Ayah audio not found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Delete Ayah Audio
      tags:
      - Audio
    get:
      consumes:
      - application/json
      description: Retrieve a specific ayah audio file.
      parameters:
      - description: Reciter ID
        in: path
        name: reciter_id
        required: true
        type: string
      - description: Surah ID
        in: path
        name: surah_id
        required: true
        type: integer
      - description: Ayah ID
        in: path
        name: ayah_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Ayah audio retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/core.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AyahAudioResponse'
              type: object
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Ayah audio not found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Get Ayah Audio
      tags:
      - Audio
    put:
      consumes:
      - application/json
      description: Update an existing ayah audio file's details.
      parameters:
      - description: Reciter ID
        in: path
        name: reciter_id
        required: true
        type: string
      - description: Surah ID
        in: path
        name: surah_id
        required: true
        type: integer
      - description: Ayah ID
        in: path
        name: ayah_id
        required: true
        type: integer
      - description: Ayah Audio Data
        in: body
        name: ayah_audio
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAyahAudioRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Ayah audio updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/core.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AyahAudioResponse'
              type: object
        "400":
          description: Invalid parameters or request body
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Update Ayah Audio
      tags:
      - Audio
  /audio/surahs/{reciter_id}/{surah_id}:
    get:
      consumes:
      - application/json
      description: Retrieve all audio files for a specific surah by a specific reciter.
      parameters:
      - description: Reciter ID
        in: path
        name: reciter_id
        required: true
        type: string
      - description: Surah ID
        in: path
        name: surah_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Audio files retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/core.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AyahAudioResponse'
                  type: array
              type: object
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Get Audio Files for a Surah
      tags:
      - Audio
  /ayahs:
    post:
      consumes:
      - application/json
      description: Create a new ayah (verse) in the Quran
      parameters:
      - description: Ayah data
        in: body
        name: ayah
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAyahRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Ayah created successfully
          schema:
            allOf:
            - $ref: '#/definitions/core.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AyahResponse'
              type: object
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Failed to create ayah
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Create a new ayah
      tags:
      - Ayah
  /ayahs/{surahId}/{ayahId}:
    delete:
      consumes:
      - application/json
      description: Delete an existing ayah (verse) from the Quran
      parameters:
      - description: Surah ID
        in: path
        name: surahId
