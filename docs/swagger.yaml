info:
  contact: {}
paths:
  /api/v1/quran/ayahs:
    post:
      consumes:
      - application/json
      description: Create a new ayah in the Quran
      parameters:
      - description: Create ayah request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAyahRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Ayah created successfully
          schema:
            $ref: '#/definitions/quran.CreateAyahSuccessResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
      summary: Create a new ayah
      tags:
      - Ayah
  /api/v1/quran/ayahs/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an existing ayah from the Quran
      parameters:
      - description: Ayah ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ayah deleted successfully
          schema:
            $ref: '#/definitions/quran.DeleteAyahSuccessResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "404":
          description: Ayah not found
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/quran.QuranErrorResponse'
      summary: Delete an ayah
      tags:
      - Ayah
    get:
      consumes:
      - application/json
      description: Get an ayah by its ID from the Quran
      parameters:
      - description: Ayah ID
        in: path
        name: id
        required: true
        type: string
      - description: Include related data
        enum:
        - surah
        example: surah
        in: query
        name: include
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ayah retrieved successfully
          schema:
            $ref: '#/definitions/quran.GetAyahByIdSuccessResponse'
        "400":
