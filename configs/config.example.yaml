app:
  name: safa-life-api
  host: "0.0.0.0"
  port: 8080
  env: "development" # change to "production" on server

db:
  host: "localhost"
  user: "postgres"
  password: "your-db-password"
  name: "safalife_db"
  port: 5432
  ssl_mode: "disable"
  timezone: "UTC"

redis:
  host: "localhost"
  port: 6379
  password: "" # fill in if Redis requires authentication
  db: 0

monitoring:
  jaeger:
    endpoint: "localhost:4318"
    service_name: "safa-life-api"
    service_version: "1.0.0"
    environment: "development"
  
  prometheus:
    enabled: true
    metrics_path: "/metrics"

jwt:
  secret: "your-secret-key-change-this"
  access_token_ttl: 60      # in minutes (1 hour)
  refresh_token_ttl: 10080  # in minutes (7 days)
  issuer: "safa-life-api"

# AWS S3 storage configuration (example)
storage:
  s3:
    enabled: true
    bucket: "your-bucket-name"
    region: "ap-southeast-1"
    access_key_id: "YOUR_AWS_ACCESS_KEY_ID"
    secret_access_key: "YOUR_AWS_SECRET_ACCESS_KEY"
    endpoint: ""           # optional custom endpoint (leave empty for AWS)
    use_path_style: false   # set true for MinIO/compat providers
    public_url_base: ""    # optional CDN or bucket public base URL

# Better Auth service configuration (JWKS for JWT verification)
auth:
  base_url: "http://localhost:3001"
  verify_path: "/auth/v1/jwt/jwks"
  timeout_seconds: 3

# Prayer times providers configuration
prayertimes:
  aladhan:
    base_url: "https://api.aladhan.com/v1"
    timeout_seconds: 15
