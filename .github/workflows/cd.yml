name: 🚀 Continuous Deployment

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  GO_VERSION: '1.21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build and Push Docker Image
  build-and-push:
    name: 🏗️ Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-

      - name: 🏗️ Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Job 2: Security Scan of Docker Image
  security-scan:
    name: 🔒 Security Scan Docker Image
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: 🔍 Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-and-push.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📤 Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 3: Deploy to Staging
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging-api.safa-life.com
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🎯 Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME_STAGING }}

      - name: 🚀 Deploy to Staging
        run: |
          # Update deployment with new image
          kubectl set image deployment/safa-life-api \
            safa-life-api=${{ needs.build-and-push.outputs.image-tag }} \
            -n staging
          
          # Wait for rollout to complete
          kubectl rollout status deployment/safa-life-api -n staging --timeout=300s

      - name: 🧪 Run Smoke Tests
        run: |
          # Wait for service to be ready
          sleep 30
          
          # Get service URL
          STAGING_URL="https://staging-api.safa-life.com"
          
          # Run basic health checks
          curl -f "$STAGING_URL/health" || exit 1
          curl -f "$STAGING_URL/v1/health" || exit 1
          
          echo "✅ Staging deployment successful!"

  # Job 4: Integration Tests on Staging
  staging-integration-tests:
    name: 🔗 Staging Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🧪 Run Integration Tests Against Staging
        env:
          API_BASE_URL: https://staging-api.safa-life.com
          TEST_ENV: staging
        run: |
          go test -v -tags=integration,staging ./tests/integration/...

  # Job 5: Deploy to Production
  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan, staging-integration-tests]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://api.safa-life.com
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🎯 Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME_PRODUCTION }}

      - name: 🌟 Deploy to Production
        run: |
          # Update deployment with new image
          kubectl set image deployment/safa-life-api \
            safa-life-api=${{ needs.build-and-push.outputs.image-tag }} \
            -n production
          
          # Wait for rollout to complete
          kubectl rollout status deployment/safa-life-api -n production --timeout=600s

      - name: 🧪 Run Production Smoke Tests
        run: |
          # Wait for service to be ready
          sleep 60
          
          # Get service URL
          PRODUCTION_URL="https://api.safa-life.com"
          
          # Run basic health checks
          curl -f "$PRODUCTION_URL/health" || exit 1
          curl -f "$PRODUCTION_URL/v1/health" || exit 1
          
          echo "✅ Production deployment successful!"

  # Job 6: Create GitHub Release
  create-release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Generate Changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "## Changes since $PREVIOUS_TAG" > CHANGELOG.md
            git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD >> CHANGELOG.md
          else
            echo "## Initial Release" > CHANGELOG.md
            git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📦 Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            🚀 **Safa Life API ${{ github.ref_name }}**
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## 🐳 Docker Image
            ```bash
            docker pull ${{ needs.build-and-push.outputs.image-tag }}
            ```
            
            ## 🔗 Deployment
            - **Production**: https://api.safa-life.com
            - **Staging**: https://staging-api.safa-life.com
            
            ## 📊 Metrics & Monitoring
            - **Grafana**: https://grafana.safa-life.com
            - **Jaeger**: https://jaeger.safa-life.com
          draft: false
          prerelease: false

  # Job 7: Notify Deployment
  notify:
    name: 📢 Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: 📢 Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: |
            🚀 **Deployment Summary**
            
            **Repository**: ${{ github.repository }}
            **Branch/Tag**: ${{ github.ref_name }}
            **Commit**: ${{ github.sha }}
            
            **Staging**: ${{ needs.deploy-staging.result }}
            **Production**: ${{ needs.deploy-production.result }}
            
            **Image**: ${{ needs.build-and-push.outputs.image-tag }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()

  # Job 8: Deployment Summary
  deployment-summary:
    name: 📋 Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging, deploy-production, create-release]
    if: always()
    steps:
      - name: 📋 Generate Deployment Summary
        run: |
          echo "## 🚀 Deployment Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Environment |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Build | ${{ needs.build-and-push.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Staging | ${{ needs.deploy-staging.result }} | https://staging-api.safa-life.com |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌟 Production | ${{ needs.deploy-production.result }} | https://api.safa-life.com |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Release | ${{ needs.create-release.result }} | GitHub Releases |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🐳 Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.build-and-push.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY