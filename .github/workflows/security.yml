name: 🔒 Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  GO_VERSION: '1.21'

jobs:
  # Job 1: Static Application Security Testing (SAST)
  sast:
    name: 🔍 Static Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐹 Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🔒 Run Gosec Security Scanner
        uses: securecodewarrior/github-action-gosec@master
        with:
          args: '-fmt sarif -out gosec.sarif ./...'

      - name: 📤 Upload Gosec SARIF Results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: go
          queries: security-and-quality

      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:go"

  # Job 2: Dependency Vulnerability Scanning
  dependency-scan:
    name: 📦 Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 📦 Download Dependencies
        run: go mod download

      - name: 🔍 Run Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -json ./... > govulncheck-results.json

      - name: 📤 Upload Govulncheck Results
        uses: actions/upload-artifact@v3
        with:
          name: govulncheck-results
          path: govulncheck-results.json

      - name: 🔍 Run Nancy (Sonatype OSS Index)
        run: |
          go list -json -deps ./... | docker run --rm -i sonatypecommunity/nancy:latest sleuth

  # Job 3: Secret Scanning
  secret-scan:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

      - name: 🔍 Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 4: License Compliance
  license-scan:
    name: 📄 License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 📄 Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: 🔍 Check Licenses
        run: |
          go-licenses check ./...
          go-licenses report ./... > licenses-report.txt

      - name: 📤 Upload License Report
        uses: actions/upload-artifact@v3
        with:
          name: license-report
          path: licenses-report.txt

  # Job 5: Docker Image Security Scan
  docker-security:
    name: 🐳 Docker Security Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: safa-life-api:security-scan
          load: true

      - name: 🔍 Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'safa-life-api:security-scan'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📤 Upload Trivy SARIF Results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

      - name: 🔍 Run Grype Vulnerability Scanner
        uses: anchore/scan-action@v3
        with:
          image: 'safa-life-api:security-scan'
          fail-build: false
          severity-cutoff: high

      - name: 📤 Upload Grype SARIF Results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: results.sarif
          category: grype

  # Job 6: Infrastructure Security (Dockerfile & Configs)
  infrastructure-security:
    name: 🏗️ Infrastructure Security
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Run Hadolint (Dockerfile Linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-results.sarif

      - name: 📤 Upload Hadolint SARIF Results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

      - name: 🔍 Run Checkov (Infrastructure as Code Security)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile,yaml
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: 📤 Upload Checkov SARIF Results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  # Job 7: API Security Testing
  api-security:
    name: 🌐 API Security Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🏗️ Build and Start API
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpassword
          DB_NAME: testdb
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          APP_ENV: test
          APP_PORT: 8080
        run: |
          go build -o safa-life-api ./src/cmd/server
          ./safa-life-api &
          sleep 10

      - name: 🔍 Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

  # Job 8: Security Policy Compliance
  compliance-check:
    name: 📋 Security Policy Compliance
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Check Security Policy Files
        run: |
          # Check for required security files
          files=(
            "SECURITY.md"
            ".github/SECURITY.md"
            "docs/SECURITY.md"
          )
          
          found=false
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ Found security policy: $file"
              found=true
              break
            fi
          done
          
          if [ "$found" = false ]; then
            echo "❌ No security policy found. Please create SECURITY.md"
            exit 1
          fi

      - name: 🔍 Check for Security Headers Configuration
        run: |
          # Check if security headers are configured
          if grep -r "X-Frame-Options\|X-Content-Type-Options\|X-XSS-Protection\|Strict-Transport-Security" src/ configs/ || \
             grep -r "helmet\|security" go.mod go.sum; then
            echo "✅ Security headers configuration found"
          else
            echo "⚠️ Consider implementing security headers"
          fi

  # Job 9: Security Summary Report
  security-summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan, secret-scan, license-scan, docker-security, infrastructure-security, compliance-check]
    if: always()
    steps:
      - name: 📊 Generate Security Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Security Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|----------------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 SAST (Gosec + CodeQL) | ${{ needs.sast.result }} | Static code analysis |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Dependency Scan | ${{ needs.dependency-scan.result }} | Vulnerability scanning |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 Secret Scan | ${{ needs.secret-scan.result }} | Secret detection |" >> $GITHUB_STEP_SUMMARY
          echo "| 📄 License Compliance | ${{ needs.license-scan.result }} | License checking |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker Security | ${{ needs.docker-security.result }} | Container scanning |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Infrastructure Security | ${{ needs.infrastructure-security.result }} | IaC scanning |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Compliance Check | ${{ needs.compliance-check.result }} | Policy compliance |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Security Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- **Scan Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Security Resources" >> $GITHUB_STEP_SUMMARY
          echo "- [Security Advisories](https://github.com/${{ github.repository }}/security/advisories)" >> $GITHUB_STEP_SUMMARY
          echo "- [Dependency Graph](https://github.com/${{ github.repository }}/network/dependencies)" >> $GITHUB_STEP_SUMMARY
          echo "- [Security Policy](https://github.com/${{ github.repository }}/security/policy)" >> $GITHUB_STEP_SUMMARY