version: "3.9"

services:
  api:
    container_name: safalife-core-api
    build:
      context: .
      args:
        APP_PORT: ${APP_PORT:-8080}
    env_file:
      - .env
    expose:
      - "${APP_PORT:-8080}"
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    restart: always
    networks:
      - safalife-net
      - kong-net

  db-migrator:
    container_name: safalife-core-migrator
    build:
      context: .
      args:
        APP_PORT: ${APP_PORT:-8080}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
    networks:
      - safalife-net
    command: >
      sh -c "
        echo '🚀 Running Database Migrations...'
        ./main migrate --config production
        echo '✅ Migration completed.'
      "

  postgres:
    image: postgres:14-alpine
    container_name: safalife-core-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safalife_core_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${DB_HOST_PORT:-9543}:5432"
    volumes:
      - safalife-core-postgres-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - safalife-net

  redis:
    image: redis:6-alpine
    container_name: safalife-core-redis
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - safalife-core-redis-data:/data
    networks:
      - safalife-net
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: safalife-core-jaeger
    restart: always
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "4317:4317"
      - "4318:4318"
    networks:
      - safalife-net
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411

  prometheus:
    image: prom/prometheus:latest
    container_name: safalife-core-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
    networks:
      - safalife-net
    depends_on:
      jaeger:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    container_name: safalife-core-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - safalife-net
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started

volumes:
  safalife-core-postgres-data:
  safalife-core-redis-data:
  prometheus_data:
  grafana-storage:

networks:
  safalife-net:
    external: true
  kong-net:
    external: true
