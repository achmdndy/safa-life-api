[changelog]
header = """
# 📜 Changelog
All notable changes to this project will be documented in this file.
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
[Compare changes](https://github.com/achmdndy/safa-life-api/compare/{{ previous.version }}...{{ version }})
---
{% else %}\
## [Unreleased]
---
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
  ([`{{ commit.id | truncate(length=7) }}`](https://github.com/achmdndy/safa-life-api/commit/{{ commit.id }}))\
  {% if commit.breaking %} ⚠️ **BREAKING CHANGE** {% endif %}\
  {% if commit.author.name %} _(by {{ commit.author.name }})_ {% endif %}
{% endfor %}

{% endfor %}

{% set breaking_commits = commits | filter(attribute="breaking") %}
{% if breaking_commits | length > 0 %}
### ⚠️ Breaking Changes
{% for commit in breaking_commits %}
- {{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7) }}`](https://github.com/achmdndy/safa-life-api/commit/{{ commit.id }}))
{% endfor %}
{% endif %}

---
"""

footer = """
📌 Generated by [git-cliff](https://github.com/orhun/git-cliff)
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_preprocessors = [
  { pattern = '\((\\w+\\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/achmdndy/safa-life-api/issues/${2}))"},
]

commit_parsers = [
  { message = "^feat", group = "✨ Features"},
  { message = "^fix", group = "🐛 Bug Fixes"},
  { message = "^doc", group = "📖 Documentation"},
  { message = "^perf", group = "⚡ Performance"},
  { message = "^refactor", group = "🔨 Refactor"},
  { message = "^style", group = "💄 Styling"},
  { message = "^test", group = "🧪 Testing"},
  { message = "^chore\\(release\\): prepare for", skip = true},
  { message = "^chore\\(deps\\)", skip = true},
  { message = "^chore\\(pr\\)", skip = true},
  { message = "^chore\\(pull\\)", skip = true},
  { message = "^chore|ci", group = "⚙️ Miscellaneous"},
  { body = ".*security", group = "🔒 Security"},
  { message = "^revert", group = "⏪ Revert"},
]

tag_pattern = "v[0-9]*"
skip_tags = "v0.1.0-beta.1"
sort_commits = "oldest"
